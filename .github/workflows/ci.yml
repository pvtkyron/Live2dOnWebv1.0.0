name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build:prod

      - name: Verify generated bundle
        run: test -s dist/live2d_bundle.js

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check waifu-tips.js
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

      - name: Validate runtime JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('waifu-tips.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('assets/blogfa-runtime-manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('site.webmanifest','utf8'))"
