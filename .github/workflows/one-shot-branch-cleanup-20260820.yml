name: One-shot branch cleanup 20260820
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-shot-branch-cleanup-20260820.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-default branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: master
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/$REPOSITORY/branches?per_page=100" --jq '.[].name')
          failures=0
          for branch in "${branches[@]}"; do
            [[ "$branch" == "$DEFAULT_BRANCH" ]] && continue
            if gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$branch" --silent; then
              echo "deleted $branch"
            else
              echo "::error::failed to delete $branch"
              failures=$((failures+1))
            fi
          done
          [[ "$failures" -eq 0 ]]
